<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#06060b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <!-- mancuerna -->
    <rect x="70" y="206" width="30" height="100" rx="10" stroke-width="18"/>
    <rect x="118" y="170" width="38" height="172" rx="12" stroke-width="20"/>
    <rect x="356" y="170" width="38" height="172" rx="12" stroke-width="20"/>
    <rect x="412" y="206" width="30" height="100" rx="10" stroke-width="18"/>
    <line x1="166" y1="256" x2="190" y2="256" stroke-width="18"/>
    <line x1="322" y1="256" x2="346" y2="256" stroke-width="18"/>
    <!-- pulso -->
    <polyline points="190,256 214,256 234,206 262,306 284,232 298,256 322,256" stroke-width="15" stroke="#c6ff3d"/>
  </g>
</svg>
